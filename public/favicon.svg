<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient Background with Rounded Squircle -->
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="60%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ccfbf1" stop-opacity="0.95" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="18" fill="url(#bg-grad)" />

  <!-- Outer Gentle Mind Balance Arc -->
  <path d="M18 32 A14 14 0 0 1 46 32" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.4" fill="none" />
  
  <!-- Therapeutic Flow Waves (Nervous System Calming) -->
  <path d="M16 38 C 24 33, 30 43, 38 38 C 44 34, 46 36, 48 37" stroke="url(#wave-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <path d="M20 45 C 26 42, 32 47, 38 44 C 41 42, 43 43, 44 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.6" fill="none" />

  <!-- Calming Center Focus Node -->
  <circle cx="32" cy="24" r="5" fill="#ffffff" />
  <circle cx="32" cy="24" r="2" fill="#0d9488" />
  
  <!-- Subtle Lotus Petal Highlights -->
  <path d="M22 28 C 22 24, 26 21, 30 23" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" fill="none" />
  <path d="M42 28 C 42 24, 38 21, 34 23" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.75" fill="none" />
</svg>
